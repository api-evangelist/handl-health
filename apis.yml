aid: handl-health
name: Handl Health
description: >-
  Handl Health is a healthcare price-transparency AI platform that turns the
  negotiated rates, gross charges, and cash prices unlocked by the Hospital
  Price Transparency and Transparency in Coverage rules into clean, usable
  pricing intelligence. Using proprietary AI models, Handl cleans and organizes
  publicly available machine-readable pricing files at scale and supplements
  them with claims, Medicare rates, and provider-directory data to build a
  holistic, validated dataset. Its products — Iris, AI-driven network analytics
  for benefits consultants to evaluate and compare carrier networks, and Arke,
  real-time cost tools that help plan members find high-value care — serve
  benefits consultants, carriers, third-party administrators, and employers
  designing alternative health plans. Handl is a Techstars- and StartUp
  Health-backed company. This profile was enriched by the API Evangelist
  pipeline; no public developer API or portal was found at the time of
  enrichment.
